name: Build SEO pages

on:
  push:
    branches: [main]
    paths:
      - 'data/diwan.json'
      - 'scripts/generate_pages.py'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate static poem/poet pages
        run: python3 scripts/generate_pages.py

      - name: Commit generated pages
        run: |
          git config user.name "diwan-bot"
          git config user.email "actions@github.com"
          # git add -A بدل قائمة مسارات ثابتة: يلتقط تلقائياً أي ملف يكتبه أو يحذفه
          # generate_pages.py (poems/, poets/, sitemap.xml, robots.txt, index.html, about.html,
          # respondents.html, 404.html...) بدون ما نحتاج نحدّث هذا الووركفلو كل ما تضاف صفحة جديدة.
          # آمن هنا لأن الـrunner يبدأ من checkout نظيف، فما فيه ملفات غريبة تنستج بالغلط.
          git add -A
          git diff --cached --quiet && echo "no changes" || git commit -m "توليد صفحات تلقائي [skip ci]"
          git push
